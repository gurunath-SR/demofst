<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account · MiniBlog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="register" class="auth-body">
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/>
          </svg>
        </span>
        <span class="brand-name">MiniBlog</span>
      </div>

      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Join MiniBlog to share short updates and follow people.</p>

      <div id="authError" class="alert-error hidden" role="alert"></div>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="regName">Full name</label>
          <input
            type="text"
            id="regName"
            name="name"
            placeholder="Alex Rivera"
            maxlength="50"
            required
          />
        </div>

        <div class="form-group">
          <label for="regUsername">Username</label>
          <input
            type="text"
            id="regUsername"
            name="username"
            placeholder="alexrivera"
            minlength="3"
            maxlength="30"
            required
          />
          <span class="field-hint">Letters, numbers, and underscores only.</span>
        </div>

        <div class="form-group">
          <label for="regEmail">Email address</label>
          <input
            type="email"
            id="regEmail"
            name="email"
            placeholder="alex@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <input
            type="password"
            id="regPassword"
            name="password"
            placeholder="At least 6 characters"
            minlength="6"
            autocomplete="new-password"
            required
          />
        </div>

        <button type="submit" class="btn-primary btn-full" id="registerSubmitBtn">Create Account</button>
      </form>

      <p class="auth-switch">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
